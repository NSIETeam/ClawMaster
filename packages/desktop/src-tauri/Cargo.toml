[package]
name = "clawmaster-desktop"
version = "0.0.2-beta.1"
description = "ClawMaster desktop shell"
authors = ["NSIETeam"]
license = "Apache-2.0"
repository = "https://github.com/NSIETeam/ClawMaster"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clawmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
brotli = "8"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = "0.26"
url = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
