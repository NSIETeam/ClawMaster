[package]
name = "clawmaster-desktop"
version = "0.0.1-preview"
description = "ClawMaster desktop shell"
authors = ["NSIETeam"]
license = "Apache-2.0"
repository = "https://github.com/NSIETeam/ClawMaster"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clawmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = "0.26"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
