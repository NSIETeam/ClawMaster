[package]
name = "clawmaster-desktop"
version = "0.0.1-preview"
description = "ClawMaster desktop shell"
authors = ["NSIETeam"]
license = "Apache-2.0"
repository = "https://github.com/NSIETeam/ClawMaster"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clawmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
