[package]
name = "clawmaster-desktop"
version = "0.0.2-beta.1"
description = "ClawMaster desktop shell"
authors = ["NSIETeam"]
license = "Apache-2.0"
repository = "https://github.com/NSIETeam/ClawMaster"
edition = "2021"
rust-version = "1.88"

[lib]
name = "clawmaster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
enigo = "0.2.1"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
lark-channel = { version = "=0.6.0", default-features = false, features = ["websocket"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
ring = "0.17"
rmcp = { version = "3.2.0", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
brotli = "8"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
chrono-tz = "0.10"
futures-util = "0.3"
sha2 = "0.10"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
