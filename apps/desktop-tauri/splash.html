<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClawMaster</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #fafaf9;
      --fg: #24262b;
      --fg-dim: #5f6672;
      --border: #dfe2e7;
      --accent: #3568c8;
      --error: #a92c23;
      --error-bg: #fff1ef;
      --brand-icon: url("app-icon.svg");
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #191b20;
        --fg: #eeeff2;
        --fg-dim: #adb4c0;
        --border: #3c414b;
        --accent: #9ebcff;
        --error: #ffb4ac;
        --error-bg: #332320;
        --brand-icon: url("app-icon-dark.svg");
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--canvas); color: var(--fg); }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      -webkit-app-region: drag;
    }
    .hero {
      display: grid;
      justify-items: center;
      gap: 20px;
      width: min(400px, 100%);
      max-height: 100%;
      text-align: center;
    }
    .mark {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      background: var(--brand-icon) center / contain no-repeat;
    }
    .brand { display: grid; gap: 8px; }
    h1 { color: var(--fg); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    .badge { color: var(--fg-dim); font-size: 13px; font-weight: 400; line-height: 1.5; }
    .status-row { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 21px; margin-top: 12px; width: 100%; }
    #status { color: var(--fg-dim); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .dots { flex: 0 0 auto; width: 12px; height: 12px; border: 1.5px solid var(--border); border-top-color: var(--fg-dim); border-radius: 50%; animation: spin 1s linear infinite; }
    .track { width: min(240px, 100%); height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; }
    #bar { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 200ms ease; }
    #error {
      display: none;
      width: 100%;
      max-height: min(150px, 30vh);
      overflow: auto;
      padding: 12px 14px;
      border: 1px solid var(--error);
      border-radius: 8px;
      color: var(--error);
      background: var(--error-bg);
      font: 11px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      -webkit-user-select: text;
      -webkit-app-region: no-drag;
    }
    #error:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    body.failed .dots, body.failed .track { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-height: 400px) { body { padding: 20px; } .hero { gap: 12px; } .mark { width: 56px; height: 56px; border-radius: 12px; } .status-row { margin-top: 4px; } }
    @media (prefers-reduced-motion: reduce) { .dots { animation: none; } #bar { transition: none; } }
  </style>
</head>
<body data-tauri-drag-region>
  <main class="hero">
    <div class="mark" aria-hidden="true"></div>
    <div class="brand">
      <h1>ClawMaster</h1>
      <p class="badge" data-i18n="splash.slogan">开启AI时代的企业协作</p>
    </div>
    <div class="status-row">
      <span class="dots" aria-hidden="true"></span>
      <p id="status" role="status" aria-live="polite" data-i18n="splash.preparing">正在启动 ClawMaster…</p>
    </div>
    <div class="track" role="progressbar" data-i18n-aria="splash.progress" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
    <p id="error" role="alert" tabindex="0" data-i18n-aria="splash.errorDetails" aria-label="启动错误详情"></p>
  </main>
  <script src="desktop-i18n.js"></script>
  <script>
    window.DSH_I18N.apply()
    const statusEl = document.getElementById('status')
    const barEl = document.getElementById('bar')
    const progressEl = document.querySelector('.track')
    const errorEl = document.getElementById('error')
    window.__DSH_SPLASH__ = {
      setStatus(text) { statusEl.textContent = text },
      setProgress(pct) {
        const value = Math.min(100, Math.max(0, pct))
        barEl.style.width = value + '%'
        progressEl.setAttribute('aria-valuenow', String(value))
      },
      setError(text) {
        document.body.classList.add('failed')
        errorEl.style.display = 'block'
        errorEl.textContent = text
        statusEl.textContent = window.DSH_I18N.t('splash.failed')
      },
    }
  </script>
</body>
</html>
