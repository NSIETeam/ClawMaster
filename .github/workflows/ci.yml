name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/windows-*']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source and architecture contracts
        run: |
          npm run doctor
          git diff --check
          npm run validate:integration-baseline
          npm run validate:boundaries
          npm run code-map:check
          npm run size:source:check

      - name: Build
        run: |
          npm run build
          npm run build --workspace=packages/desktop

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test:ci

      - name: Verify E2EE release policy
        run: |
          npm run security:e2ee:adversarial
          npm run security:e2ee:release:verify
          npm run security:e2ee:policy:check

      - name: Preserve security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-ci-evidence
          path: |
            artifacts/security/e2ee-adversarial-report.json
            packages/evals/artifacts/latest.json
            packages/evals/artifacts/junit.xml
          if-no-files-found: warn
