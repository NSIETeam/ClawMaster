name: Android Cloud Validation

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-cloud-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.api-level }} emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Create disposable validation signing key
        shell: bash
        run: |
          key="$RUNNER_TEMP/android-validation.jks"
          keytool -genkeypair -v -keystore "$key" -storepass validation-only -keypass validation-only \
            -alias clawmaster -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ClawMaster CI Validation, OU=Temporary, O=ClawMaster, C=CN"
          echo "ANDROID_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=validation-only" >> "$GITHUB_ENV"

      - name: Run core tests, lint, and release build
        run: gradle -p apps/android :core:test :app:lintRelease :app:assembleRelease

      - name: Verify APK signature and record checksum
        shell: bash
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee android-signature.txt
          sha256sum "$apk" | tee android-sha256.txt
          mkdir -p android-validation-artifact
          cp "$apk" android-validation-artifact/clawmaster-android-validation.apk
          cp android-signature.txt android-sha256.txt android-validation-artifact/

      - name: Enable hardware-accelerated Android emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the release app on a cloud emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            gradle -p apps/android :app:connectedReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=team.nsi.clawmaster.android.StandaloneAgentTest,team.nsi.clawmaster.android.WorkspaceAgentTest

      - name: Upload validation artifact and evidence
        if: always() && hashFiles('android-validation-artifact/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: clawmaster-android-cloud-validation-api-${{ matrix.api-level }}-${{ github.sha }}
          path: android-validation-artifact/
          if-no-files-found: error
          retention-days: 7
