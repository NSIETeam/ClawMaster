name: Windows Rust Diagnostic

on:
  push:
    branches: [diag/windows-rust]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: native-rpa, source_ref: 986d2de13397f53af6b271f876099818e26d239c }
          - { label: webdriver, source_ref: 3d43db259b629e88fc078ba93409e0907e11b760 }
          - { label: exact-window, source_ref: b2650acbfd6b695967a511a84949e668e0411bd3 }
          - { label: process-tree, source_ref: 10c0c9d08f79816b0504ca8b333c7dee757b16cc }
          - { label: semantic-wait, source_ref: b15f67a6c443d604a343eaab884c671276f1b13a }
          - { label: tenant-profile, source_ref: d45fab2947934ebfa6b3d26e505a53865b6690cf }
          - { label: hardened-rpa, source_ref: 34ebe3cf97a09ec4c4136ba4a2821abd329c02e6 }
          - { label: release-head, source_ref: ab691cab0507da5398a4b7525cebdfc2c9949cd8 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Create diagnostic frontend placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/desktop/dist/renderer | Out-Null
          Set-Content packages/desktop/dist/renderer/index.html '<!doctype html><title>diagnostic</title>'
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib definitions_and_risks_keep_writes_confirmation_gated -- --exact
