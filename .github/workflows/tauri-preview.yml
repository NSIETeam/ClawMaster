name: ClawMaster Tauri Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish only the explicitly authorized beta.1 release.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/tauri-preview.yml'
      - '.github/workflows/rpa-browser-e2e.yml'
      - 'packages/core/**'
      - 'packages/rpa/**'
      - 'packages/desktop/**'
      - 'clawmaster-native/**'
      - 'scripts/**'
      - 'package-lock.json'
      - 'package.json'
  push:
    branches: [main, 'codex/**']
    tags: ['v0.0.2-beta.1']

permissions:
  contents: read

jobs:
  preflight:
    name: Runtime, schedule, RPA and stress acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=packages/core
      - run: npx playwright install --with-deps chromium
      - run: npm run release:preflight
        env: { RUN_RPA_BROWSER_E2E: '1' }

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
          - { name: macOS-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: macOS-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: Linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:renderer --workspace=packages/desktop
      - run: npm run tauri:build --workspace=packages/desktop
      - run: npm run release:formal:gate --workspace=packages/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ClawMaster-${{ matrix.name }}
          path: packages/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ClawMaster v0.0.2-beta.1
    needs: build
    if: github.ref == 'refs/tags/v0.0.2-beta.1' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: ClawMaster-*, path: release-assets, merge-multiple: true }
      - name: Verify all four release families
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -type f -name '*.deb' -print -quit)"
          sha256sum $(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) | sort) > release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.2-beta.1
          name: ClawMaster v0.0.2-beta.1
          prerelease: true
          generate_release_notes: true
          files: release-assets/**
