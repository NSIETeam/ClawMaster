name: ClawMaster Tauri Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tauri-preview.yml'
      - '.github/workflows/rpa-browser-e2e.yml'
      - 'packages/core/**'
      - 'packages/rpa/**'
      - 'packages/desktop/**'
      - 'clawmaster-native/**'
      - 'scripts/**'
      - 'package-lock.json'
      - 'package.json'
  push:
    branches: [main, 'codex/windows-*', 'codex/0.0.2-release']
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  preflight:
    name: Runtime, schedule, RPA and stress acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '22.16.0', cache: npm }
      - name: Validate authorized release source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          git fetch origin main
          test "$GITHUB_REF_NAME" = "v${version}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate:integration-baseline
      - run: npm run build --workspace=packages/core
      - run: npx playwright install --with-deps chromium
      - run: npm run release:preflight
        env: { RUN_RPA_BROWSER_E2E: '1' }

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc }
          - { name: macOS-arm64, os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24.20.0', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:renderer --workspace=packages/desktop
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --lib
      - name: Reject legacy packaged runtimes
        shell: bash
        run: |
          ! grep -R -E 'clawmaster-node|better_sqlite3[.]node|agent-payload' packages/desktop/src-tauri/tauri.conf.json packages/desktop/src-tauri/src
      - run: npm run tauri:build --workspace=packages/desktop
      - run: npm run release:beta:gate --workspace=packages/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: ClawMaster-${{ matrix.name }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/dmg/*_aarch64.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ClawMaster ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: ClawMaster-*, path: release-assets, merge-multiple: true }
      - name: Verify Windows and macOS ARM64 release assets
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -type f -name '*.msi' -print -quit)"
          test -n "$(find release-assets -type f -name '*_aarch64.dmg' -print -quit)"
          : > release-assets/SHA256SUMS
          while IFS= read -r file; do
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$(basename "$file")" >> release-assets/SHA256SUMS
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*_aarch64.dmg' \) | sort)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClawMaster ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/**
