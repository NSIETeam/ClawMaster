name: Tauri Release Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create or update the GitHub Release for the current package version.'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create or update the release as a draft.'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark the release as a prerelease.'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/tauri-preview.yml'
      - '.github/workflows/tauri-node-runtime.yml'
      - 'native/node-runtime/**'
      - 'native/sqlcipher-tauri/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/desktop/**'
      - 'otto-native/**'
      - 'package-lock.json'
      - 'package.json'
  push:
    branches: [main, 'codex/windows-*']
    tags:
      - 'v*.*.*'
    paths:
      - '.github/workflows/tauri-preview.yml'
      - '.github/workflows/tauri-node-runtime.yml'
      - 'native/node-runtime/**'
      - 'native/sqlcipher-tauri/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/desktop/**'
      - 'otto-native/**'
      - 'package-lock.json'
      - 'package.json'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  native-assets:
    uses: ./.github/workflows/sqlcipher-native.yml

  node-runtime:
    uses: ./.github/workflows/tauri-node-runtime.yml

  macos:
    name: macOS ${{ matrix.arch }} release
    needs: [native-assets, node-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            rustTarget: aarch64-apple-darwin
            nativeTarget: darwin-arm64
          - runner: macos-15-intel
            arch: x64
            rustTarget: x86_64-apple-darwin
            nativeTarget: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install locked dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: tauri-sqlcipher-${{ matrix.nativeTarget }}
          path: native/sqlcipher-tauri

      - uses: actions/download-artifact@v7
        with:
          name: tauri-node-${{ matrix.nativeTarget }}
          path: native/node-runtime/${{ matrix.nativeTarget }}

      - name: Verify repository and Tauri release contracts
        run: |
          npm run doctor
          npm run code-map:check
          npm run typecheck --workspace=packages/desktop
          npx vitest run \
            packages/desktop/src/main/self-modification-runtime.test.ts \
            packages/desktop/src/main/self-modification-candidate-supervisor.test.ts \
            packages/desktop/src/main/self-modification-task-coordinator.test.ts \
            packages/desktop/src/main/self-modification-version-registry.test.ts \
            packages/desktop/src/main/self-modification-ipc.test.ts \
            packages/desktop/src/main/self-modification-controller.test.ts \
            packages/desktop/src/main/self-modification-infrastructure.test.ts \
            packages/desktop/scripts/tauri-runtime-policy.test.mjs \
            packages/desktop/scripts/tauri-node-runtime-contract.test.mjs \
            packages/desktop/scripts/tauri-runtime-compression.test.mjs \
            packages/desktop/scripts/verify-tauri-sqlcipher-asset.test.mjs \
            packages/desktop/scripts/verify-tauri-dmg.test.mjs

      - name: Build and verify Tauri release DMG
        run: npm run tauri:build --workspace=packages/desktop

      - name: Gate formal ClawMaster release artifact
        run: npm run release:formal:gate --workspace=packages/desktop

      - name: Record download checksum
        working-directory: packages/desktop/src-tauri/target/release/bundle/dmg
        run: |
          set -euo pipefail
          dmg="$(find . -maxdepth 1 -type f -name 'ClawMaster_*.dmg' ! -name '*.optimized.dmg' -print -quit)"
          test -n "$dmg"
          shasum -a 256 "$dmg" > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: ClawMaster-macOS-${{ matrix.arch }}-Tauri-Release
          path: |
            packages/desktop/src-tauri/target/release/bundle/dmg/ClawMaster_*.dmg
            packages/desktop/src-tauri/target/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64 release
    needs: [native-assets, node-runtime]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: tauri-sqlcipher-win32-x64
          path: native/sqlcipher-tauri

      - uses: actions/download-artifact@v7
        with:
          name: tauri-node-win32-x64
          path: native/node-runtime/win32-x64

      - name: Verify repository and Tauri release contracts
        shell: pwsh
        run: |
          npm run doctor
          npm run code-map:check
          npm run typecheck --workspace=packages/desktop
          npx vitest run `
            packages/desktop/src/main/self-modification-runtime.test.ts `
            packages/desktop/src/main/self-modification-candidate-supervisor.test.ts `
            packages/desktop/src/main/self-modification-task-coordinator.test.ts `
            packages/desktop/src/main/self-modification-version-registry.test.ts `
            packages/desktop/src/main/self-modification-ipc.test.ts `
            packages/desktop/src/main/self-modification-controller.test.ts `
            packages/desktop/src/main/self-modification-infrastructure.test.ts `
            packages/desktop/scripts/tauri-runtime-policy.test.mjs `
            packages/desktop/scripts/tauri-node-runtime-contract.test.mjs `
            packages/desktop/scripts/tauri-runtime-compression.test.mjs `
            packages/desktop/scripts/verify-tauri-sqlcipher-asset.test.mjs `
            packages/desktop/scripts/verify-tauri-windows-installer.test.mjs

      - name: Build and verify Tauri release installer
        run: npm run tauri:build --workspace=packages/desktop

      - name: Gate formal ClawMaster release artifact
        run: npm run release:formal:gate --workspace=packages/desktop

      - name: Install and smoke-test Windows release
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          packages/desktop/scripts/smoke-tauri-windows-install.ps1 -Installer $installer.FullName

      - name: Record download checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          Get-FileHash $installer.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($installer.Name)" } |
            Set-Content packages/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: ClawMaster-Windows-x64-Tauri-Release
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ClawMaster Tauri release
    needs: [macos, windows-x64]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$version" != "$desktop_version" ]; then
            echo "Version mismatch: root=$version desktop=$desktop_version" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            tag="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          pattern: ClawMaster-*-Tauri-Release
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          test -f "release-assets/ClawMaster_${version}_aarch64.dmg"
          test -f "release-assets/ClawMaster_${version}_x64.dmg"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          find release-assets -maxdepth 1 -type f \
            \( -name 'ClawMaster_*.dmg' -o -name '*.exe' \) \
            -print0 | sort -z | xargs -0 sha256sum > release-assets/ClawMaster-${version}-SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ClawMaster v${{ steps.release.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft != false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          generate_release_notes: true
          files: |
            release-assets/ClawMaster_*.dmg
            release-assets/*.exe
            release-assets/ClawMaster-*-SHA256SUMS
