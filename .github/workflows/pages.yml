name: Deploy ClawMaster product site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify product page contract
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/release-manifest.json
          test -f site/.nojekyll
          grep -q 'v0.0.2-beta.2' site/index.html
          grep -q 'ClawMaster_0.0.2-2_x64-setup.exe' site/index.html
          grep -q 'ClawMaster_0.0.2-beta.2_aarch64.dmg' site/index.html
          node -e "const m=require('./site/release-manifest.json'); if(m.schemaVersion!==1||!m.assets.windows||!m.assets.windowsMsi||!m.assets.mac) process.exit(1)"
          if grep -R -E 'sk-[[:alnum:]_-]{20,}' site; then
            echo 'site contains a credential-like value' >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy product site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
