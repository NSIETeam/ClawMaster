name: Deploy ClawMaster product site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/verify-product-site.mjs'
      - 'scripts/verify-product-site.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify product page contract
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app.js
          node --test scripts/verify-product-site.test.mjs
          node scripts/verify-product-site.mjs
          if grep -R -E 'sk-[[:alnum:]_-]{20,}' site; then
            echo 'site contains a credential-like value' >&2
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy product site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
