name: Tauri Minimal Node Runtime

on:
  workflow_call:
    inputs:
      windows_only:
        description: 'Build only the Windows runtime required by the formal Windows release.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Build only the Windows runtime.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.target }} balanced Node runtime
    if: inputs.windows_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Restore verified minimal runtime cache
        id: runtime-cache
        uses: actions/cache@v5
        with:
          path: native/node-runtime/${{ matrix.target }}
          key: tauri-node-v4-${{ matrix.target }}-71b8b174857e25106d39b61a9e6f30d927da8b01-lto

      - name: Check out the verified Node 24.20.0 release source
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: nodejs/node
          ref: 71b8b174857e25106d39b61a9e6f30d927da8b01
          path: node-source
          fetch-depth: 1

      - name: Configure balanced ClawMaster Node runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        working-directory: node-source
        run: |
          ./configure \
            --disable-single-executable-application \
            --enable-lto \
            --v8-disable-object-print \
            --without-amaro \
            --without-corepack \
            --without-node-options \
            --without-npm \
            --with-intl=small-icu \
            --with-icu-locales=en,zh-CN

      - name: Build and strip Node runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        working-directory: node-source
        run: |
          make -j3
          strip -x out/Release/node
          codesign --force --sign - out/Release/node

      - name: Finalize runtime asset
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          node packages/desktop/scripts/finalize-tauri-node-runtime.mjs \
            --binary node-source/out/Release/node \
            --output-directory native/node-runtime/${{ matrix.target }} \
            --target ${{ matrix.target }}

      - name: Verify runtime asset
        run: |
          node packages/desktop/scripts/verify-tauri-node-runtime.mjs \
            --asset-directory native/node-runtime/${{ matrix.target }} \
            --target ${{ matrix.target }} \
            --node-version 24.20.0
          if otool -L native/node-runtime/${{ matrix.target }}/node | grep -E '/(opt|usr/local)/'; then
            echo 'minimal Node runtime contains a machine-local dynamic dependency' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tauri-node-${{ matrix.target }}
          path: native/node-runtime/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: win32-x64 balanced Node runtime
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Restore verified Windows runtime cache
        id: runtime-cache
        uses: actions/cache@v5
        with:
          path: native/node-runtime/win32-x64
          key: tauri-node-v7-win32-x64-6cac9ffbca8f6a47091e4b5c772e0606049c3871cb67d900c0cedde630e545ba-official

      - name: Download and verify official Node 24.20.0 Windows runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archiveName = 'node-v24.20.0-win-x64.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $downloadUrl = 'https://nodejs.org/download/release/v24.20.0/node-v24.20.0-win-x64.zip'
          curl.exe --fail --location --retry 5 --retry-all-errors `
            --connect-timeout 15 --output $archivePath $downloadUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Node runtime download failed with exit code $LASTEXITCODE"
          }
          $expectedHash = '6cac9ffbca8f6a47091e4b5c772e0606049c3871cb67d900c0cedde630e545ba'
          $actualHash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Node runtime SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          Expand-Archive -Path $archivePath -DestinationPath $env:RUNNER_TEMP -Force

      - name: Finalize runtime asset
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          node packages/desktop/scripts/finalize-tauri-node-runtime.mjs `
            --binary "$env:RUNNER_TEMP/node-v24.20.0-win-x64/node.exe" `
            --output-directory native/node-runtime/win32-x64 `
            --target win32-x64

      - name: Verify runtime asset
        shell: pwsh
        run: |
          node packages/desktop/scripts/verify-tauri-node-runtime.mjs `
            --asset-directory native/node-runtime/win32-x64 `
            --target win32-x64 `
            --node-version 24.20.0

      - uses: actions/upload-artifact@v7
        with:
          name: tauri-node-win32-x64
          path: native/node-runtime/win32-x64/
          if-no-files-found: error
          retention-days: 14
