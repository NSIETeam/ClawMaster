name: RPA browser E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  isolated-browser-rpa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify RPA against a local isolated page
        env:
          RUN_RPA_BROWSER_E2E: '1'
        run: npm run test:e2e --workspace=packages/rpa
