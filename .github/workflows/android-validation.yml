name: ClawMaster Standalone Android

on:
  workflow_dispatch:
  push:
    branches: [codex/android-v0.0.1]
    paths:
      - apps/android/**
      - .github/workflows/android-validation.yml

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/clawmaster-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build and verify the standalone release code
        run: |
          node --test apps/android/scripts/verify-instrumentation.test.mjs
          gradle -p apps/android :core:test :app:lintRelease :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon
      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apps/android/app/build/outputs/apk/release/app-release.apk
            adb install apps/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            gradle -p apps/android :app:connectedReleaseAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=team.nsi.clawmaster.android.StandaloneAgentTest,team.nsi.clawmaster.android.WorkspaceAgentTest --no-daemon
            adb shell am force-stop team.nsi.clawmaster.android
            adb shell am start -W -n team.nsi.clawmaster.android/.MainActivity
            adb shell uiautomator dump /sdcard/clawmaster-relaunch.xml
            adb pull /sdcard/clawmaster-relaunch.xml apps/android/app/build/clawmaster-relaunch.xml
            node apps/android/scripts/verify-relaunch.mjs apps/android/app/build/clawmaster-relaunch.xml
            gradle -p apps/android :app:connectedReleaseAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=team.nsi.clawmaster.android.ColdStartCheck --no-daemon
            adb pull /sdcard/Android/data/team.nsi.clawmaster.android/files/release-screen.png apps/android/app/build/release-screen.png
      - name: Record APK integrity and source
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apps/android/app/build/outputs/apk/release/app-release.apk
          node apps/android/scripts/record-apk.mjs apps/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apps/android/app/build/outputs/apk/release/app-release.apk | tee apps/android/app/build/apk-signature.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/apk/release/*.json
            apps/android/app/build/reports/
            apps/android/app/build/apk-signature.txt
            apps/android/core/build/reports/tests/
            apps/android/app/build/clawmaster-relaunch.xml
            apps/android/app/build/release-screen.png
          retention-days: 14
          if-no-files-found: error
